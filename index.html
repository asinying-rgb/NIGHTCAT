<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜貓子的狂想 | Night Owl's Reverie</title>
    <style>
        /* 🎨 全域變數：微醺馬卡龍復古配色（柔和、耐看、保護眼睛） */
        :root {
            --bg-color: #0f0c1b;      /* 稍微帶有明度的深夜紫藍色底，比純黑更溫柔 */
            --main-pink: #E55B85;     /* 降低飽和度的玫瑰粉紅（告別刺眼，變溫柔） */
            --sub-cyan: #5CE1E6;      /* 帶有粉質的湖水青色（更像日系復古雜誌感） */
            --text-main: #F4F3F6;     /* 稍微帶點米白的暖白文字，減少純白對眼睛的刺激 */
            --text-sub: #7D7890;      /* 柔和的暮光霧灰 */
            --card-bg: rgba(255, 255, 255, 0.015);
            --glass-bg: rgba(255, 255, 255, 0.01);
            --glass-border: rgba(255, 255, 255, 0.04);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, 'Noto Sans TC', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 15%, rgba(229, 91, 133, 0.08) 0%, transparent 50%),
                              radial-gradient(circle at 80% 60%, rgba(92, 225, 230, 0.05) 0%, transparent 45%);
        }

        /* 導覽列 */
        header {
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px 10%;
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
            background: rgba(15, 12, 27, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border);
        }

        .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 10px rgba(229, 91, 133, 0.3); }
        .nav-links { display: flex; list-style: none; }
        .nav-links li { margin-left: 30px; }
        .nav-links a { color: var(--text-sub); text-decoration: none; font-size: 16px; transition: 0.3s; }
        .nav-links a:hover { color: var(--sub-cyan); text-shadow: 0 0 8px var(--sub-cyan); }

        /* 通用區塊設定 */
        section { padding: 120px 10% 80px 10%; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .section-title { font-size: 36px; margin-bottom: 15px; text-align: center; letter-spacing: 2px; text-shadow: 0 0 15px rgba(92, 225, 230, 0.1); }
        .section-subtitle { color: var(--text-sub); margin-bottom: 50px; font-size: 16px; text-align: center; }

        /* 主視覺區 */
        #home { text-align: center; background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.2)); }
        #home h1 { font-size: 52px; margin-bottom: 25px; letter-spacing: 2px; line-height: 1.3; color: var(--text-main); }
        #home p { font-size: 18px; color: var(--text-sub); max-width: 650px; margin-bottom: 45px; line-height: 1.6; }
        .btn-cta {
            display: inline-block; padding: 16px 45px; background: transparent; color: var(--main-pink);
            border: 2px solid var(--main-pink); border-radius: 50px; font-size: 18px; font-weight: bold;
            text-decoration: none; transition: 0.4s; box-shadow: 0 0 15px rgba(229, 91, 133, 0.1);
        }
        .btn-cta:hover { background: var(--main-pink); color: var(--bg-color); box-shadow: 0 0 25px var(--main-pink); transform: translateY(-3px); }

        /* AI 複合式控制台 */
        .ai-dashboard {
            background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(12px);
            padding: 40px; border-radius: 24px; max-width: 1150px; width: 100%;
            display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .control-panel { display: flex; flex-direction: column; justify-content: center; }
        .panel-label { font-size: 13px; color: var(--sub-cyan); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; font-weight: bold; }
        .options-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; }

        .select-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); color: var(--text-sub);
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s;
        }
        .select-btn:hover { border-color: var(--sub-cyan); color: #fff; }

        /* 標籤啟動特效 */
        .location-group .select-btn.active { background: rgba(92, 225, 230, 0.1); border-color: var(--sub-cyan); color: var(--sub-cyan); box-shadow: 0 0 12px rgba(92, 225, 230, 0.15); }
        .mood-group .select-btn.active { background: rgba(229, 91, 133, 0.1); border-color: var(--main-pink); color: var(--main-pink); box-shadow: 0 0 12px rgba(229, 91, 133, 0.15); }

        .btn-generate {
            background: linear-gradient(45deg, var(--main-pink), #ed799d); color: var(--bg-color); border: none;
            padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: 0.3s; box-shadow: 0 0 15px rgba(229, 91, 133, 0.2); margin-top: 10px;
        }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--main-pink); color: var(--bg-color); }

        /* 右側播放器面板 */
        .player-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 1px solid var(--glass-border); padding-left: 40px; }
        .vinyl-wrapper { position: relative; width: 180px; height: 180px; margin-bottom: 25px; }
        .vinyl {
            width: 100%; height: 100%; background: radial-gradient(circle, #252033 25%, #0d0a17 55%, #181426 65%, #05040a 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px rgba(0,0,0,0.5);
        }
        .vinyl.playing { animation: rotateVinyl 6s linear infinite; }
        .vinyl-center { width: 60px; height: 60px; background: var(--main-pink); border-radius: 50%; border: 5px solid #0d0a17; }
        .vinyl.playing .vinyl-center { background: var(--sub-cyan); box-shadow: 0 0 15px var(--sub-cyan); }
        @keyframes rotateVinyl { 100% { transform: rotate(360deg); } }

        .status-text { font-size: 18px; font-weight: bold; margin-bottom: 8px; text-align: center; color: var(--text-main); }
        .style-display { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; text-align: center; line-height: 1.6; min-height: 75px; }

        /* 音訊跳動波形圖 */
        .wave-container { display: flex; align-items: center; gap: 4px; height: 30px; opacity: 0.15; }
        .wave-container.active { opacity: 1; }
        .wave-bar { width: 3px; height: 100%; background: var(--sub-cyan); border-radius: 3px; }
        .wave-container.active .wave-bar { animation: jump 1s ease-in-out infinite alternate; }
        .wave-container.active .wave-bar:nth-child(2n) { animation-delay: 0.2s; background: var(--main-pink); }
        .wave-container.active .wave-bar:nth-child(3n) { animation-delay: 0.4s; }
        @keyframes jump { 0% { height: 20%; } 100% { height: 100%; } }

        /* 音樂作品牆 */
        .music-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; width: 100%; max-width: 1000px; }
        .music-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 24px; transition: 0.4s; text-align: center; position: relative; overflow: hidden; }
        .music-card:hover { transform: translateY(-10px); border-color: var(--main-pink); box-shadow: 0 10px 25px rgba(229, 91, 133, 0.1); }

        .cover-art { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #1b152e, #0d0a17); border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; font-size: 45px; border: 1px solid rgba(255,255,255,0.02); }
        .music-card h3 { font-size: 20px; margin-bottom: 8px; color: var(--text-main); }
        .music-card p { color: var(--text-sub); font-size: 14px; }

        /* 關於我 */
        .about-content { display: flex; align-items: center; gap: 60px; max-width: 950px; width: 100%; flex-wrap: wrap; }
        .about-img { width: 260px; height: 260px; background: linear-gradient(45deg, var(--main-pink), var(--sub-cyan)); border-radius: 24px; box-shadow: 0 0 25px rgba(92, 225, 230, 0.1); }
        .about-text { flex: 1; min-width: 300px; }
        .about-text p { font-size: 17px; color: var(--text-main); line-height: 1.9; margin-bottom: 18px; letter-spacing: 0.5px; }

        /* 聯絡合作 */
        .contact-form { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 16px; background: rgba(255,255,255,0.01);
            border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; font-size: 16px; transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--sub-cyan); box-shadow: 0 0 10px rgba(92, 225, 230, 0.1); }
        .btn-submit { padding: 16px; background: transparent; border: 2px solid var(--sub-cyan); color: var(--sub-cyan); font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: var(--sub-cyan); color: var(--bg-color); box-shadow: 0 0 15px var(--sub-cyan); }

        footer { text-align: center; padding: 40px; color: var(--text-sub); font-size: 14px; border-top: 1px solid var(--glass-border); margin-top: 60px; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            #home h1 { font-size: 36px; }
            .ai-dashboard { grid-template-columns: 1fr; }
            .player-panel { border-left: none; padding-left: 0; padding-top: 40px; border-top: 1px solid var(--glass-border); }
            .about-content { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Night Owl's Reverie</div>
        <ul class="nav-links">
            <li><a href="#home">首頁</a></li>
            <li><a href="#ai-studio">AI實驗室</a></li>
            <li><a href="#tracks">展示牆</a></li>
            <li><a href="#about">關於我</a></li>
            <li><a href="#contact">聯絡合作</a></li>
        </ul>
    </header>

    <section id="home">
        <h1>智慧環境音樂調配系統</h1>
        <p>此版本已完全託管於 NIGHTCAT 倉庫中。4 首高音質原創單曲已完美扎根，流暢調配、拒絕盜連阻擋！</p>
        <a href="#ai-studio" class="btn-cta">🎧 進入控制台</a>
    </section>

    <section id="ai-studio">
        <h2 class="section-title">智慧音場實驗室</h2>
        <p class="section-subtitle">客製化你的音樂場景，體驗由 14 首豐富曲目交織而成的音訊世界</p>
        
        <div class="ai-dashboard">
            <div class="control-panel">
                
                <div class="panel-label">📍 1. 選擇模擬空間（環境地點）</div>
                <div class="options-group location-group">
                    <button class="select-btn active" onclick="selectLocation(this, 'cafe', '雨天咖啡廳', '混入窗外微雨聲景與輕微的瓷杯低語白噪音')">☕ 咖啡廳</button>
                    <button class="select-btn" onclick="selectLocation(this, 'library', '虛擬圖書館', '注入高吸音、極度安靜且能聽見微弱呼吸聲的專注感')">📚 圖書館</button>
